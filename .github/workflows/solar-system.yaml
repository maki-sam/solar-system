name: solar-system-work flow

on:
    workflow_dispatch:
    push:
        branches:
            - 'main'
            - 'feature/*'
jobs:
    unit-testing:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code Repo
              uses: actions/checkout@v3
            - name: Setup NodeJs Version - 18
              uses: actions/setup-node@v3
              with:
                  node-version: 18
            - name: Install Dependencies
              run: npm install

            - name: Run Unit Tests
              run: npm test