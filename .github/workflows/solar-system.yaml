name: solar-system-work flow

on:
    workflow_dispatch:
    push:
        branches:
            - 'main'
            - 'feature/*'

env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Run Unit Tests
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
            env:
              MONGO_URI: 'mongodb://localhost:27017/superData'
              MONGO_USERNAME: non-prod-user
              MONGO_PASSWORD: non-prod-password
        strategy:
            matrix:
                node-version: [18, 19]
                operation_system: [ubuntu-latest]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code Repo
              uses: actions/checkout@v6
            
            - name: Setup NodeJs Version - 18
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
            
            - name: Chache Node Modules
              uses: actions/cache@v3
              with:
                path: node_modules
                key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
                
            - name: Install Dependencies
              run: npm install

            - name: Run Unit Tests
              id: nodejs-unit-testing-step
              run: npm test

            - name: Archive Test Result
              if: always()
              uses: actions/upload-artifact@v6
              with:
                name: Test-Results
                path: test-result.xml

    code-coverage:
        name: Run Code Coverage
        container:
          image: node:18
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            options:
              --name mongo
            env:
              MONGO_URI: 'mongodb://mongo:27017/superData'
              MONGO_USERNAME: non-prod-user
              MONGO_PASSWORD: non-prod-password
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code Repo
              uses: actions/checkout@v6
            
            # - name: Setup NodeJs Version - 18
            #   uses: actions/setup-node@v5
            #   with:
            #       node-version: ${{ matrix.node-version }}

            - name: Chache Node Modules
              uses: actions/cache@v3
              with:
                path: node_modules
                key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Install Dependencies
              run: npm install

            - name: Check Code Coverage
              continue-on-error: true
              run: npm run coverage
            
            - name: Upload Code Coverage Result
              uses: actions/upload-artifact@v6
              with:
                name: Code-Coverage-Results
                path: coverage/
                retention-days: 5

    docker:
      name: Containerize Application
      needs: [unit-testing, code-coverage]
      permissions:
        contents: read
        packages: write
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code Repo
          uses: actions/checkout@v6
        
        - name: DockerHub Login
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: GHCR Login
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}            

        - name: Docker Build For Testing
          uses: docker/build-push-action@v7
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

        - name: Docker Image Testing
          run: |
            docker images
            docker run --name solar-system-test -d \
            -p 3000:3000 \
            -e MONGO_URI=${{ env.MONGO_URI }} \
            -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
            -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

            export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-test)
            echo "Container IP: $IP"

            echo "Waiting for the application to start..."
            echo "Testing Image URL using wget..."
            wget -q -O - 127.0.0.1:3000/live | grep live

        - name: Container Register Push
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: |
              ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}



    dev-deployment:
      needs: docker
      outputs:
        APP_INGRESS_URL: ${{ steps.set-app-ingress-url.outputs.APP_INGRESS_HOST }}
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code Repo
          uses: actions/checkout@v6

        # - name: Create k8s Kind Cluster
        #   uses: helm/kind-action@v1.10.0

        - name: Set Kubeconfig file
          uses: azure/k8s-set-context@v3
          with:
            method: kubeconfig
            kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

        - name: Install K8s CLI
          uses: azure/setup-kubectl@v4
          with:
            version: 'latest'
          id: install

        - name: Fetch K8s Cluster Details
          run: |
            kubectl version -o yaml
            echo -------------------------
            kubectl get nodes

        # - name: Save K8s Controller IP as GitHub Action Secrect
        #   run: |
        #     export INGRESS_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        #     echo "INGRESS_IP=$INGRESS_IP" >> $GITHUB_ENV

        - name: Replace Tokens in K8s
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '${'
            tokenSuffix: '}'
            files: 'kubernetes/development/*.yaml'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            K8S_IMAGE: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
            INGRESS_IP: ${{ secrets.INGRESS_IP }}

        - name: Create Namespace (If Not Exists)
          run: |
            kubectl create namespace ${{ vars.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

        - name: Check K8s Files
          run: |
            cat kubernetes/development/deployment.yaml

        - name: Create MongoDB Secret
          run: |
            kubectl create secret generic mongo-db-creds \
            --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
            --from-literal=MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
            --from-literal=MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
            --save-config=true \
            -n ${{ vars.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
            
        - name: Deploy to Dev Environment
          run: |
            kubectl apply -f kubernetes/development/ -n ${{ vars.NAMESPACE }}

        - name: Set App Ingress URL
          id: set-app-ingress-url
          run: |
            echo "APP_INGRESS_HOST=$(kubectl get ingress -n ${{ vars.NAMESPACE }} solar-system -o jsonpath='{.spec.rules[0].host}')"
            echo "APP_INGRESS_HOST=$HOST_URL" >> "$GITHUB_OUTPUT"

    integration-testing:  
      needs: dev-deployment
      runs-on: ubuntu-latest
      steps:
        - name: Test URL Output with CURL
          env:
            URL: ${{ needs.dev-deployment.outputs.APP_INGRESS_URL }}
          run: |
            echo $URL
            echo "---------------------------"
            curl https://$URL/live -s -k  | jq -r .status | grep -i live
